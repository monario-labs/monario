name: Stage testnet draft wallet assets

on:
  push:
    branches:
      - ci/testnet-draft-assets

permissions:
  actions: read
  contents: write

jobs:
  stage:
    if: github.repository == 'monario-labs/monario'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Stage draft testnet assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="monario-labs/monario"
          RELEASE_ID="457190869"
          RELEASE_API="repos/${REPO}/releases/${RELEASE_ID}"
          UPLOAD_API="https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets"
          OLD_COMMIT="925dbc33764124b5f599dc49c7b9c156232382fa"
          NEW_COMMIT="d675d3458ca5a1b8efa301cfc5e1e11626604023"
          RUN_ID="46065133776"
          SUFFIX="-d675d34"
          SUMS_NAME="SHA256SUMS${SUFFIX}"

          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          umask 077
          AUTH_HEADER="$WORK/auth.hdr"
          printf 'Authorization: Bearer %s\n' "$GH_TOKEN" > "$AUTH_HEADER"
          STAGE_DIR="$WORK/stage"
          SUMS_FILE="$STAGE_DIR/$SUMS_NAME"
          mkdir -p "$STAGE_DIR"
          : > "$SUMS_FILE"

          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          check_release() {
            local state
            state="$(gh api "$RELEASE_API" --jq '[(.draft | tostring), (.prerelease | tostring), ((.published_at == null) | tostring), .target_commitish] | join(" ")')"
            case "$state" in
              "true true true $OLD_COMMIT"|"true true true $NEW_COMMIT") ;;
              *) fail "Release state mismatch: $state" ;;
            esac
          }

          check_run() {
            local state
            state="$(gh run view "$RUN_ID" --repo "$REPO" --json status,conclusion,headSha --jq '[.status, .conclusion, .headSha] | join(" ")')"
            [ "$state" = "completed success $NEW_COMMIT" ] || fail "Run state mismatch: $state"
          }

          stage_artifact() {
            local slug="$1"
            local ext="$2"
            local artifact="testnet-wallet-preview-${slug}"
            local base="monario-testnet-desktop-${slug}"
            local name="${base}.${ext}"
            local versioned="${base}${SUFFIX}.${ext}"
            local dir="$WORK/$artifact"
            local found=()
            local sums_found=()
            local file sums expected actual

            mkdir -p "$dir"
            gh run download "$RUN_ID" --repo "$REPO" --name "$artifact" --dir "$dir"

            mapfile -t found < <(find "$dir" -type f -name "$name")
            [ "${#found[@]}" -eq 1 ] || fail "Expected exactly one $name in $artifact, found ${#found[@]}"
            file="${found[0]}"

            mapfile -t sums_found < <(find "$dir" -type f -name SHA256SUMS)
            [ "${#sums_found[@]}" -eq 1 ] || fail "Expected exactly one SHA256SUMS in $artifact, found ${#sums_found[@]}"
            sums="${sums_found[0]}"

            expected="$(awk -v n="$name" '$2 == n {count++; hash = $1} END {if (count != 1) exit 1; print hash}' "$sums")" \
              || fail "SHA256SUMS in $artifact must contain exactly one line for $name"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || fail "Invalid SHA256SUMS digest for $name"

            actual="$(sha256sum "$file" | awk '{print $1}')"
            [ "$actual" = "$expected" ] || fail "SHA256 mismatch for $name"

            cp "$file" "$STAGE_DIR/$versioned"
            printf '%s  %s\n' "$expected" "$versioned" >> "$SUMS_FILE"
            echo "Verified $versioned sha256:$expected"
          }

          upload_asset() {
            local file="$1"
            local name="$2"
            local expected="$3"
            local content_type="$4"
            local existing response digest_line

            existing="$(gh api "repos/${REPO}/releases/${RELEASE_ID}/assets" --paginate --jq ".[] | select(.name == \"$name\") | .digest")"
            if [ -n "$existing" ]; then
              while IFS= read -r digest_line; do
                [ "$digest_line" = "sha256:$expected" ] || fail "Existing asset $name has a different digest; refusing to replace"
              done <<< "$existing"
              echo "$name already present with matching digest; skipping upload"
              return 0
            fi

            response="$WORK/$name.json"
            curl -fsS --max-time 65 -X POST \
              -H @"$AUTH_HEADER" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: $content_type" \
              --data-binary @"$file" \
              "${UPLOAD_API}?name=${name}" \
              -o "$response"

            jq -e --arg n "$name" --arg d "sha256:$expected" \
              '.name == $n and .state == "uploaded" and .digest == $d' "$response" >/dev/null \
              || fail "Upload response validation failed for $name"

            echo "Uploaded $name sha256:$expected"
          }

          check_release
          check_run

          stage_artifact "windows-x86_64" "zip"
          stage_artifact "linux-x86_64" "tar.gz"
          stage_artifact "macos-x86_64" "zip"
          stage_artifact "macos-arm64" "zip"

          sums_digest="$(sha256sum "$SUMS_FILE" | awk '{print $1}')"
          echo "Generated $SUMS_NAME sha256:$sums_digest"

          check_release
          check_run

          for archive in "$STAGE_DIR"/monario-testnet-desktop-*"$SUFFIX".*; do
            name="$(basename "$archive")"
            digest="$(sha256sum "$archive" | awk '{print $1}')"
            case "$name" in
              *.tar.gz) content_type="application/gzip" ;;
              *) content_type="application/zip" ;;
            esac
            upload_asset "$archive" "$name" "$digest" "$content_type"
          done

          upload_asset "$SUMS_FILE" "$SUMS_NAME" "$sums_digest" "text/plain"

          check_release
          echo "Draft release unchanged after upload"
