server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = / {
        try_files /index.html =404;
    }
    location = /snapshot.json {
        root /srv/snapshot;
        expires -1;
        try_files $uri =404;
    }
    location ~ ^/(style\.css|explorer\.js|monario-mark\.png)$ {
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
