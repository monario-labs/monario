[package]
name = "monario-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
monario-chain = { path = "../chain" }
monario-v6 = { path = "../v6" }
getrandom = "=0.4.3"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
snow = { version = "=0.10.0", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
zeroize = "=1.9.1"
curve25519-dalek = { version = "=4.1.3", default-features = false }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
ureq = { version = "=3.5.2", default-features = false, features = ["native-tls-no-default"] }
ctrlc = { version = "=3.4.5", features = ["termination"] }
monario-monetary = { path = "../.." }
monario-address = { path = "../address" }
monario-pow = { path = "../pow" }
monario-randomx = { path = "../randomx" }
monario-wallet-scan = { path = "../wallet-scan" }

[dev-dependencies]
monario-wallet = { path = "../wallet" }
zcash_primitives = { version = "=0.31.0", default-features = false, features = ["std"] }
zcash_protocol = "=0.11.0"
zcash_transparent = "=0.11.0"
zcash_script = "=0.6.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
