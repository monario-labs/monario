[package]
name = "monario-chain"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
monario-monetary = { path = "../.." }
monario-pow = { path = "../pow" }
monario-randomx = { path = "../randomx" }
num-bigint = { version = "=0.4.6", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
orchard = { version = "=0.16.0", default-features = false, features = ["std"] }
incrementalmerkletree = "=0.9.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
secp256k1 = "=0.33.1"
ripemd = "=0.2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[dev-dependencies]
tempfile = "=3.27.0"
